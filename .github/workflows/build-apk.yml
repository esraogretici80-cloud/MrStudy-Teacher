name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          java -version

          VERSION_RAW=$(java -version 2>&1 | awk -F '"' '/version/ {print $2; exit}')
          if [ -z "$VERSION_RAW" ]; then
            echo "::error::Failed to detect the active Java version."
            exit 1
          fi

          if [[ "$VERSION_RAW" == 1.* ]]; then
            MAJOR_VERSION=$(echo "$VERSION_RAW" | cut -d. -f2)
          else
            MAJOR_VERSION=$(echo "$VERSION_RAW" | cut -d. -f1)
          fi

          if ! [[ "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to parse Java major version from '${VERSION_RAW}'."
            exit 1
          fi

          echo "Active Java major version: ${MAJOR_VERSION}"
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java ${MAJOR_VERSION}."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "./debug.keystore" ]; then
            echo "Temporary debug keystore already exists."
          else
            KEYTOOL_BIN="keytool"
            if [ -n "${JAVA_HOME:-}" ] && [ -x "${JAVA_HOME}/bin/keytool" ]; then
              KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            fi

            if ! "$KEYTOOL_BIN" -genkeypair \
              -keystore "./debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 >/dev/null 2>&1; then
              echo "::error::Failed to generate temporary debug keystore."
              exit 1
            fi
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "::error::./debug.keystore does not exist after generation."
            exit 1
          fi
          echo "Verified temporary debug keystore exists."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -e "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK not found at ${EXPECTED_APK}."
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files inside app/build/outputs/apk:"
              find "app/build/outputs/apk" -type f -name "*.apk" -print || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::${EXPECTED_APK} exists but is not a regular file."
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::${EXPECTED_APK} is empty."
            exit 1
          fi

          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "::error::${EXPECTED_APK} does not have the .apk extension."
            exit 1
          fi

          echo "Verified debug APK: ${EXPECTED_APK}"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO_NAME=$(echo "$RAW_REPO_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9._-]+/-/g; s/-+/-/g; s/^-+//; s/-+$//')
          if [ -z "$SAFE_REPO_NAME" ]; then
            SAFE_REPO_NAME="android-app"
          fi

          RELEASE_ASSET_DIR=$(mktemp -d "${RUNNER_TEMP}/release-asset.XXXXXX")
          ASSET_NAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_PATH="${RELEASE_ASSET_DIR}/${ASSET_NAME}"

          cp "$EXPECTED_APK" "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Prepared release asset validation failed at ${ASSET_PATH}."
            exit 1
          fi

          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset filename: ${ASSET_NAME}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v gh >/dev/null 2>&1; then
            echo "::warning::GitHub CLI (gh) is not available on the runner."
            exit 1
          fi
          gh --version

          if [ -z "${ASSET_PATH:-}" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::warning::Prepared release asset is missing or invalid; skipping release creation."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          RELEASE_NOTES=$(cat <<EOF
          This is an automatically generated debug APK built by GitHub Actions.

          - **Workflow Run Number:** ${GITHUB_RUN_NUMBER}
          - **Workflow Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source Commit SHA:** ${GITHUB_SHA}
          - **Asset:** ${ASSET_NAME}

          **Important Notes:**
          - This APK is intended for testing purposes only.
          - This APK is **not** a Play Store production release.
          - This APK is signed only with a temporary debug keystore generated during the workflow run.
          EOF
          )

          if ! gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "$GITHUB_SHA" \
            --latest; then
            echo "::warning::Failed to publish GitHub Release ${RELEASE_TAG}. The debug APK build and Actions artifact (app-debug-apk) remain available."
            exit 1
          fi

      - name: Report APK download result
        if: ${{ always() && steps.publish_release.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          if [ "$PUBLISH_OUTCOME" = "success" ]; then
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url --jq '.url')
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "GitHub Release URL: ${RELEASE_URL}"
            echo "APK Asset Filename: ${ASSET_NAME}"
            gh release view "$RELEASE_TAG"

            {
              echo "### Debug APK Build & Release Published"
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **APK Asset Filename:** \`${ASSET_NAME}\`"
              echo "- **Release Page URL:** ${RELEASE_URL}"
              echo ""
              echo "Download the APK directly from the **Assets** section on the GitHub Release page above."
              echo "The GitHub Actions artifact (\`app-debug-apk\`) is also available on this workflow run as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed, but the debug APK build succeeded and the Actions artifact 'app-debug-apk' remains available."
            {
              echo "### Debug APK Build Succeeded (Release Publishing Failed)"
              echo "- **Warning:** Publishing the GitHub Release (\`${RELEASE_TAG}\`) failed."
              echo "- **APK Build Status:** Succeeded"
              echo "- **Backup Download:** Download the \`app-debug-apk\` artifact from the **Artifacts** section of this GitHub Actions workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
